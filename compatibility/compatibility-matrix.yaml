  announcement_date: "2026-09-20"

  mcp-rope:0.7.2:
    status: active
    last_releases_until: "2026-12-31"
    sunset_date: "2027-01-15"
    supported_customers: "all"

  mcp-rope:0.8.0:
    status: released
    earliest_deployment: "2027-01-01"
    required_by: "2027-04-15"

  migration_resources:
    - changelog: "MIGRATION-0.7-to-0.8.md"
    - breaking_changes: "BREAKING_CHANGES.md"
    - support_window: "90 days"
    - rollback_support: "30 days post-migration"

affected_customers:
  # NOTE: Identify teams using 0.7.2
```

