## Compatibility Matrix Governance

### Approval Authority

- **New combination:** Architecture control plane (must verify)
- **Deprecation:** Repository owner (with notification)
- **Sunset:** Architecture control plane (with migration plan)
- **Emergency exception:** Fleet ops + affected repo owner (with justification)

### Communication

- **Announcement:** 90 days before sunset
- **Escalation:** 30 days before sunset (if migration not started)
- **Cutoff:** 7 days before sunset (production support withdrawn)

### Audit Trail

Every matrix entry logs:

```yaml
entry:
  created_date: "2026-09-20T00:00:00Z"
  created_by: "architecture-control-plane"
  last_modified: "2026-09-20T00:00:00Z"
  verification_status: "established"

  decision_record:
    type: ADR | integration-scan | deprecation-notice
    link: "# NOTE: governance artifact link"
    approval: "# NOTE: approver signature"
```

