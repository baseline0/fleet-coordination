## Matrix Update Process

### Trigger

New compatibility matrix entry is created when:

1. **New combination tested and verified** (integration scan passes)
2. **New repository added** to federation (admission gate passes)
3. **Major version released** (requires ADR + conformance testing)
4. **Deprecation announced** (with sunset date and migration path)

### Verification Checklist

Before marking a combination `verified`:

- [ ] Unit tests pass (all repos)
- [ ] Integration scan: 0 new boundary violations
- [ ] Contract tests pass (producer + consumer)
- [ ] End-to-end workflows tested
- [ ] Boundary compliance verified
- [ ] Performance baseline captured
- [ ] Security audit (if applicable)
- [ ] Documentation updated

### Rollback Plan

If a combination fails verification:

- [ ] Revert to last known good combination
- [ ] Root-cause analysis (ADR)
- [ ] Fix identified in owning repository
- [ ] Re-test combination
- [ ] Update matrix with results

