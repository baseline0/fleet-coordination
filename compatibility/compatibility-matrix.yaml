## Compatibility Rules

### Guaranteed Compatible

```yaml
compatible_pairs:
  - fleet-agents:0.2.0 + mcp-rope:0.7.2  # tested
  - fleet-agents:0.2.0 + mcp-vscode:0.6.1  # tested
  - mcp-rope:0.7.2 + fleet-ops:0.9.0  # tested
  - mcp-vscode:0.6.1 + fleet-ops:0.9.0  # tested
```

### NOT Tested (Do Not Deploy)

```yaml
untested_pairs:
  - fleet-agents:0.2.0 + mcp-rope:0.6.0  # deprecated rope version
  - fleet-agents:0.1.x + anything  # superseded
  - mcp-rope:0.7.2 + fleet-ops:0.8.0  # fleet-ops too old

  # NOTE: Any new combinations require integration testing
```

