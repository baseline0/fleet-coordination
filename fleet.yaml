# Fleet Release Manifest - Version 0.1.0 Candidate
# Date: 2026-09-20
# Status: DISCOVERED AND REGISTERED (not yet fully approved)
# Authority: Architecture control plane
#
# OPERATIONAL NOTE: This 14-repository fleet has expanded blast radius.
# fleet-push defaults to DRY-RUN. Use --scope, --repos, --lifecycle flags.
# Proposed and quarantined repositories are excluded by default.

fleet_release: "0.1.0"
status: "discovered_and_registered"
contract_bundle: "0.1.0"
description: "14-repository managed fleet: governance + runtime + providers + applications"

fleet_scope:
  core:
    - fleet-base
    - fleet-agents
    - fleet-coordination
    - fleet-ops
    - mcp-rope
    - mcp-vscode
    - toolboxes

  managed:
    - flashcards
    - membrane
    - cv
    - income-ops
    - research
    - sites
    - demos

  trial:
    - fleet-ops
    - fleet-coordination
    - mcp-vscode

scope_requirements:
  core:
    refs_required: true
    contract_artifact_required: true
    contract_verification_required: true
    contract_verification_blocks_promotion: true
    contract_verification_status: pending
    boundaries_required: true
    description: "Core federation — immutable, verified, release-managed"

  managed:
    refs_required: true
    contract_artifact_required: false
    contract_verification_required: policy_defined
    boundaries_required: false
    description: "Registered applications — not yet part of core release candidate"

  trial:
    refs_required: true
    contract_artifact_required: true
    contract_verification_required_for_trial_path: true
    full_federation_verification_required: false
    boundaries_required_for_trial_repos: true
    trial_path_contracts_required:
      - OperationContext
      - AuditEvent
      - CapabilityRequest
      - CapabilityDecision
      - ProviderReference
      - ProviderInvoker
      - trial_profile
    description: "Runtime trial participants — trial-path verification required, full federation verification optional"

boundary_configuration:
  core_repositories:
    path: .fleet/boundaries.md
    required: true
  managed_repositories:
    path: .fleet/boundaries.md (standardizing)
    required: false

managed_repository_operational_states:
  description: "Orthogonal flags describing repository operational scope (not mutually exclusive)"

  registered:
    description: "Catalog entry only (discovery/inventory)"
    required_fields:
      - owner
      - lifecycle

  managed:
    description: "Included in health checks and evaluation operations"
    implies:
      - health_check: enabled
      - evaluation: enabled

  release_managed:
    description: "Immutable refs and participates in fleet release candidates"
    requires:
      - refs: immutable (40-char SHA)
      - lifecycle: approved or mature
      - boundary_policy: defined

  trial_participant:
    description: "Approved for runtime trial scope"
    requires:
      - trial_profile: reference
      - authorization: explicit

example_repository_state:
  flashcards:
    registered: true
    managed: true
    release_managed: false
    trial_participant: false

layer_model:
  layer_0: "Shared libraries (reusable, no MCP/provider-specific code)"
  layer_1: "Governance, runtime, providers, capabilities"
  layer_2: "Applications, projects, research, operations"

release_lifecycle:
  candidate: "Manifest exists; validation may have warnings"
  verified: "Immutable refs, boundary requirements, contracts pass"
  trial: "Verified candidate approved for bounded internal use"
  approved: "Trial evidence reviewed and accepted"
  retired: "No longer selectable"

governance:
  framework_version: "0.1.0"
  boundary_rules: "governance/boundary-rules.yaml"
  repository_manifest: "governance/repository-manifest.yaml"
  repository_lifecycle: "governance/repository-lifecycle.yaml"
  boundary_remediations: "governance/boundary-remediations.yaml"

compatibility:
  matrix_version: "0.1.0"
  matrix_file: "compatibility/compatibility-matrix.yaml"

trial:
  profile_version: "0.1.0"
  profile_file: "trial/trial-profile-readonly-poc.yaml"
  duration_days: 14
  start_date: "2026-10-04"
  end_date: "2026-10-18"
  approved_providers:
    - mcp-vscode

lifecycle_operations:
  proposed:
    fleet_push: false
    health_check: true
    evaluation: true
  incubating:
    fleet_push: false
    health_check: true
    evaluation: true
  approved:
    fleet_push: true
    health_check: true
    evaluation: true
  mature:
    fleet_push: true
    health_check: true
    evaluation: true
  deprecated:
    fleet_push: false
    health_check: true
    evaluation: true
  quarantined:
    fleet_push: false
    health_check: limited
    evaluation: true
  retired:
    fleet_push: false
    health_check: false
    evaluation: false

dependency_graph:
  fleet-base:
    shared_by:
      - fleet-agents
      - fleet-coordination
      - toolboxes

  fleet-agents:
    protocol_provided_to:
      - mcp-rope
      - mcp-vscode
      - toolboxes

  fleet-coordination:
    governance_for:
      - fleet-ops
      - mcp-rope
      - mcp-vscode
      - fleet-agents
      - toolboxes

  fleet-ops:
    depends_on:
      - fleet-agents
      - fleet-coordination
    runtime_for:
      - mcp-rope
      - mcp-vscode

  mcp-rope:
    protocol_from:
      - fleet-agents
    invoked_by:
      - fleet-ops

  mcp-vscode:
    protocol_from:
      - fleet-agents
    invoked_by:
      - fleet-ops

  toolboxes:
    protocol_from:
      - fleet-agents
    depends_on:
      - fleet-base

