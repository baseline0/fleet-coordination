# Fleet Release Manifest - Version 0.1.0 Candidate
# Date: 2026-09-20
# Status: DISCOVERED AND REGISTERED (not yet fully approved)
# Authority: Architecture control plane
#
# OPERATIONAL NOTE: This 14-repository fleet has expanded blast radius.
# fleet-push defaults to DRY-RUN. Use --scope, --repos, --lifecycle flags.
# Proposed and quarantined repositories are excluded by default.

fleet_release: "0.1.0"
status: "discovered_and_registered"
contract_bundle: "0.1.0"
description: "14-repository managed fleet: governance + runtime + providers + applications"

fleet_scope:
  core:
    - fleet-base
    - agent-tooling
    - fleet-coordination
    - fleet-ops
    - rope-mcp
    - vscode-workspace-mcp
    - toolboxes

  managed:
    - flashcards
    - membrane
    - cv
    - income-ops
    - research
    - sites
    - demos

  trial:
    - fleet-ops
    - fleet-coordination
    - vscode-workspace-mcp

boundary_configuration:
  core_repositories:
    path: .fleet/boundaries.md
    required: true
  managed_repositories:
    path: .fleet/boundaries.md (standardizing)
    required: false

layer_model:
  layer_0: "Shared libraries (reusable, no MCP/provider-specific code)"
  layer_1: "Governance, runtime, providers, capabilities"
  layer_2: "Applications, projects, research, operations"

release_lifecycle:
  candidate: "Manifest exists; validation may have warnings"
  verified: "Immutable refs, boundary requirements, contracts pass"
  trial: "Verified candidate approved for bounded internal use"
  approved: "Trial evidence reviewed and accepted"
  retired: "No longer selectable"

governance:
  framework_version: "0.1.0"
  boundary_rules: "governance/boundary-rules.yaml"
  repository_manifest: "governance/repository-manifest.yaml"
  repository_lifecycle: "governance/repository-lifecycle.yaml"
  boundary_remediations: "governance/boundary-remediations.yaml"

compatibility:
  matrix_version: "0.1.0"
  matrix_file: "compatibility/compatibility-matrix.yaml"

trial:
  profile_version: "0.1.0"
  profile_file: "trial/trial-profile-readonly-poc.yaml"
  duration_days: 14
  start_date: "2026-10-04"
  end_date: "2026-10-18"
  approved_providers:
    - vscode-workspace-mcp

lifecycle_operations:
  proposed:
    fleet_push: false
    health_check: true
    evaluation: true
  incubating:
    fleet_push: false
    health_check: true
    evaluation: true
  approved:
    fleet_push: true
    health_check: true
    evaluation: true
  mature:
    fleet_push: true
    health_check: true
    evaluation: true
  deprecated:
    fleet_push: false
    health_check: true
    evaluation: true
  quarantined:
    fleet_push: false
    health_check: limited
    evaluation: true
  retired:
    fleet_push: false
    health_check: false
    evaluation: false

dependency_graph:
  fleet-base:
    shared_by:
      - agent-tooling
      - fleet-coordination
      - toolboxes

  agent-tooling:
    protocol_provided_to:
      - rope-mcp
      - vscode-workspace-mcp
      - toolboxes

  fleet-coordination:
    governance_for:
      - fleet-ops
      - rope-mcp
      - vscode-workspace-mcp
      - agent-tooling
      - toolboxes

  fleet-ops:
    depends_on:
      - agent-tooling
      - fleet-coordination
    runtime_for:
      - rope-mcp
      - vscode-workspace-mcp

  rope-mcp:
    protocol_from:
      - agent-tooling
    invoked_by:
      - fleet-ops

  vscode-workspace-mcp:
    protocol_from:
      - agent-tooling
    invoked_by:
      - fleet-ops

  toolboxes:
    protocol_from:
      - agent-tooling
    depends_on:
      - fleet-base

