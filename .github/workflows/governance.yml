name: Governance Schema Validation

on:
  push:
    branches: [main]
    paths:
      - '.fleet/**'
  pull_request:
    branches: [main]
    paths:
      - '.fleet/**'

jobs:
  validate-governance:
    name: Validate Fleet Governance Schema
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Check governance compliance (all repos)
        run: |
          cd fleet-coordination
          uv run python scripts/check_fleet_governance.py --strict

      - name: Export governance report
        if: always()
        run: |
          cd fleet-coordination
          uv run python scripts/check_fleet_governance.py --json > /tmp/governance-report.json

      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-report
          path: /tmp/governance-report.json
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('/tmp/governance-report.json', 'utf8'));
            const compliant = report.filter(r => r.valid).length;
            const total = report.length;
            const status = compliant === total ? '✅ PASS' : '❌ FAIL';

            let comment = `## Fleet Governance Check ${status}\n\n`;
            comment += `Schema Version: 1.0\n`;
            comment += `Compliant: ${compliant}/${total}\n\n`;

            if (compliant < total) {
              comment += '### Non-Compliant Repos:\n';
              report.filter(r => !r.valid).forEach(r => {
                comment += `- **${r.repo_name}**\n`;
                r.errors.forEach(e => comment += `  - ❌ ${e}\n`);
              });
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
