# Validate Fleet Metadata
# 
# Purpose: Report-only CI check of repository metadata against fleet governance contract.
# This is a trial validation; failures do not block PR merge.
#
# Triggered when: Pull request modifies .fleet/ files

name: Validate Fleet Metadata

on:
  pull_request:
    paths:
      - '.fleet/**'

permissions:
  contents: read

jobs:
  metadata-validation:
    runs-on: ubuntu-latest
    name: Fleet metadata contract check
    
    steps:
      # Step 1: Get provider HEAD SHA
      - name: Capture provider head SHA
        run: echo "PROVIDER_HEAD=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV

      # Step 2: Get workflow commit SHA
      - name: Capture workflow commit SHA
        run: echo "WORKFLOW_SHA=${{ github.workflow_sha }}" >> $GITHUB_ENV

      # Step 3: Check out the current repository (the one being modified)
      - name: Checkout provider repository
        uses: actions/checkout@v4
        with:
          path: provider-repo
          ref: ${{ github.event.pull_request.head.sha }}

      # Step 4: Check out fleet-ops at the pinned reader commit
      - name: Checkout fleet-ops (metadata reader)
        uses: actions/checkout@v4
        with:
          repository: mark-alexiuk/fleet-ops
          ref: '146c316f0b45719ac088192f68aa60960742052a'
          path: fleet-ops-tools

      # Step 5: Set up Python
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      # Step 6: Run metadata validation and generate structured report
      - name: Validate fleet metadata contract
        run: |
          cd fleet-ops-tools
          uv run python3 << 'PYTHON'
          import sys
          import json
          import time
          from pathlib import Path
          
          start_time = time.time()
          validator_success = False
          diagnostics = []
          
          try:
              sys.path.insert(0, 'src')
              
              from fleet_ops.services.fleet_metadata_reader import FleetMetadataReader
              
              reader = FleetMetadataReader()
              repo_path = Path('../provider-repo')
              model, state = reader.read(repo_path)
              validator_success = True
              
              # Check for missing required fields and build diagnostics
              if model.owner is None:
                  diagnostics.append({
                      "code": "missing_required_field",
                      "field": "owner",
                      "message": "Required repository identity field 'owner' is missing."
                  })
              
              if model.layer is None:
                  diagnostics.append({
                      "code": "missing_required_field",
                      "field": "layer",
                      "message": "Required repository identity field 'layer' is missing."
                  })
              
              if model.lifecycle is None:
                  diagnostics.append({
                      "code": "missing_required_field",
                      "field": "lifecycle",
                      "message": "Required repository identity field 'lifecycle' is missing."
                  })
          
          except Exception as e:
              state = "failed"
              validator_success = False
              diagnostics.append({
                  "code": "validator_error",
                  "message": f"Validator invocation failed: {str(e)}"
              })
          
          elapsed_seconds = time.time() - start_time
          
          # Structured output for consumption and artifacts
          result = {
              "timestamp": time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              "provider_repository": model.repository_id if validator_success else "unknown",
              "provider_head_sha": "${{ env.PROVIDER_HEAD }}",
              "workflow_commit_sha": "${{ env.WORKFLOW_SHA }}",
              "validator_fleet_ops_sha": "146c316f0b45719ac088192f68aa60960742052a",
              "schema_version": "1.0",
              "artifact_schema_version": "1.0",
              "read_state": state if validator_success else "failed",
              "validator_invocation_succeeded": validator_success,
              "diagnostics": diagnostics,
              "metadata": {
                  "owner": model.owner if validator_success else None,
                  "layer": model.layer if validator_success else None,
                  "lifecycle": model.lifecycle if validator_success else None,
                  "component_type": model.component_type if validator_success else None,
              } if validator_success else None,
              "elapsed_seconds": round(elapsed_seconds, 2)
          }
          
          # Save structured result to JSON artifact
          with open('../validation-result.json', 'w') as f:
              json.dump(result, f, indent=2)
          
          # Print human-readable summary to logs
          print("=" * 70)
          print("Fleet Metadata Validation Report")
          print("=" * 70)
          print(f"Provider: {result['provider_repository']}")
          print(f"Provider head SHA: {result['provider_head_sha'][:12]}")
          print(f"Validator SHA: {result['validator_fleet_ops_sha'][:12]}")
          print(f"Workflow SHA: {result['workflow_commit_sha'][:12]}")
          print(f"Schema version: {result['schema_version']}")
          print(f"Read state: {result['read_state'].upper()}")
          print(f"Elapsed time: {result['elapsed_seconds']}s")
          print()
          
          if validator_success:
              if model.owner:
                  print(f"Owner: {model.owner}")
              if model.layer is not None:
                  print(f"Layer: {model.layer}")
              if model.lifecycle:
                  print(f"Lifecycle: {model.lifecycle}")
              if model.component_type:
                  print(f"Type: {model.component_type}")
          
          if diagnostics:
              print("\nDiagnostics:")
              for diag in diagnostics:
                  print(f"  - {diag['code']}: {diag['message']}")
          
          print("=" * 70)
          
          if result['read_state'] == 'ok':
              print("✅ Metadata is valid and complete.")
          else:
              print(f"⚠️  Metadata validation returned: {result['read_state']}")
              print("\nFor remediation, see:")
              print("  https://github.com/mark-alexiuk/fleet-ops/blob/main/docs/governance/GOVERNANCE_ROLLOUT_PLAN.md")
              print("\nThis is a report-only check during the trial phase.")
              print("Merge is not blocked.")
          
          # Report-only: always succeed (metadata validity never blocks)
          # But fail on validator invocation errors
          if not validator_success and not diagnostics:
              exit(1)  # CI machinery failure: exit with error
          else:
              exit(0)  # Metadata status (ok/warning/failed) never blocks
          PYTHON

      # Step 7: Upload structured validation artifact
      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-validation-result
          path: validation-result.json
          retention-days: 30
          if-no-files-found: warn
