    result_rationale: |
      Result remains PARTIAL because remediation was intentionally scoped to ONE module.

      **What was fixed (LIVE_DASHBOARD_V2):**
      6 telemetry extractors now return explicit TelemetryResult with status field.
      PARTIAL status is at aggregation layer only (when mixed success/failure occurs).
      Callers check status before using values; no silent unwrapping.
      Dashboard displays error indicators when data quality issues detected.
      Error messages are operator-safe (no paths, exception types, stack traces).

      **What was NOT changed (as authorized):**
      enhanced_remediation.py (4 handlers) — Deferred to future audit/remediation
      repo_eval.py (3 handlers) — Deferred to future audit/remediation
      Other modules (7 handlers) — Deferred to future audit/remediation
      Total: 14 risky handlers remain unchanged

      **Design choice for PARTIAL status:**
      Individual extractors can only return: OK, EMPTY, UNAVAILABLE, FAILED
      Only _load_recent_runs() aggregation can determine PARTIAL (mixed outcomes)
      This correctly separates concerns: extractor contract vs. aggregation contract

      **Why result is PARTIAL (not PASS):**
      - Remediation addressed 6/20 (30%) of silent-failure risks in fleet-agents
      - 14 risky handlers remain (intentionally deferred outside pilot scope)
      - Scope was one module to validate approach before scaling
      - This is DELIBERATE: pilot phase validates, then scales if effective

    operational_consequence_before: |
      Live dashboard metrics unreliable when file I/O or JSON parsing fails silently.
      Operator cannot distinguish "0 repos processed" (valid) from "repo listing failed" (error).

    operational_consequence_after: |
      Live dashboard telemetry extraction now reports explicit status.
      Operator can see "⚠️ Incomplete" when metrics have errors.
      Failures distinguishable from valid empty data.
      Error context available for debugging.

      **Remaining risk (outside this remediation):**
      enhanced_remediation.py and repo_eval.py still have silent-failure handlers.
      These may hide errors from operators/analyzers.
      Future pilot may address them using same approach.

