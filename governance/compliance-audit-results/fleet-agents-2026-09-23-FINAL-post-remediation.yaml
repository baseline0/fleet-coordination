      - **Scope limitation (intentional):** Remediation addressed only live_dashboard_v2.py.
        14 risky handlers remain in other modules. This is deliberate: pilot validated
        the approach; next phase may expand if operational signals justify it.

      - **Test coverage (unit/integration focused):** 29 new tests cover exception paths in
