## Subrule Definitions (Details)

### BOUNDARY-001-PRODUCTION Subrules

**BOUNDARY-001-PRODUCTION-CORE**
- Applies to: src/agent_*.py, src/protocols/
- Forbidden: Any rope_mcp or vscode_workspace_mcp import
- Remediation: Core logic should depend on protocol abstractions

**BOUNDARY-001-PRODUCTION-ORCHESTRATION**
- Applies to: src/*orchestration*.py, src/router.py
- Forbidden: Direct MCP imports (except at injection point)
- Remediation: Accept providers via dependency injection or provider registry

**BOUNDARY-001-PRODUCTION-ADAPTER**
- Applies to: src/adapters/
- Exception: Permitted to import MCP implementations
- Requirement: Must use adapter-allowlist.yaml, owner must be named
- Review: Before any new adapter addition

### BOUNDARY-001-UNIT Subrules

**BOUNDARY-001-UNIT-FIXTURES**
- Applies to: tests/fixtures/
- Permitted: Fixture implementations (mocks, stubs, fakes)
- Requirement: Must be in tests/fixtures/, not inline in tests/

**BOUNDARY-001-UNIT-PARAMETRIZED**
- Applies to: tests/test_*.py with parametrization
- Permitted: Test data generators (must not import real MCPs)

### BOUNDARY-001-INTEGRATION Subrules

**BOUNDARY-001-INTEGRATION-PROVIDER-EXPLICIT**
- Requires: Provider named in test docstring or metadata
- Example: `@integration_test(provider="rope-mcp")`

**BOUNDARY-001-INTEGRATION-OWNERSHIP**
- Requires: Named test owner (person responsible)
- Requires: Maintenance plan (update frequency, deprecation signal)

### BOUNDARY-002-FLEET-OPS Subrules

**BOUNDARY-002-FLEET-OPS-WHITELIST-STANDARD**
- Public API: fleet_ops.* (stable)
- Internal: fleet_ops.src.* (unstable, no guarantees)

**BOUNDARY-002-FLEET-OPS-EXCEPTION-TRACKING**
- All exceptions in adapter-allowlist.yaml
- Each exception: owner, justification, expiry date
- CI alert if exception approaches expiry without resolution

