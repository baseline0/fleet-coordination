lifecycle_gates:
  admission:
    description: "Gate for new repository to enter federation (proposed → incubating)"
    requirements:
      - Role declaration with owner and public contracts
      - Owner named (person, not team)
      - Dependency declaration (allowed + forbidden)
      - Security assessment complete
      - Provider catalog entry drafted
      - Conformance test skeleton
      - Release policy documented
      - Architecture review completed
    approver: "Architecture control plane"

  maturity_promotion:
    description: "Gate for repository to move to production federation status (approved → mature)"
    requirements:
      - Contract stability verified (90+ days)
      - Test coverage ≥90% (critical paths)
      - Runtime observability enabled
      - Boundary compliance verified
      - Release policy proven (≥2 releases)
      - Incident response documented
      - Operational ownership on-call
      - Backward compatibility policy enforced
    approver: "Architecture control plane + operational lead"

  deprecation_notice:
    description: "Gate for beginning repository retirement (mature → deprecated)"
    requirements:
      - Replacement identified and tested
      - Migration path published
      - Current consumer inventory created
      - Successor availability confirmed
      - Sunset date set (90+ days out)
      - Announcement issued
      - Support period defined
    approver: "Repository owner + architecture control plane"

  retirement:
    description: "Gate for archiving repository (quarantined → retired)"
    requirements:
      - All consumers migrated
      - Existing leases expired or transferred
      - Credentials revoked
      - Provider disabled in fleet-ops
      - Catalog entry removed
      - Repository archived (read-only)
      - Final documentation preserved
    approver: "Architecture control plane"

---

# Lifecycle state transition criteria (documented above in gates)
**Entry criteria:**
- Passed security assessment
- Public contracts identified
- Release policy committed

**Requirements in this state:**
- Owner on-call
- Local tests passing
- Compatibility entry created
- Consumers notified

**Exit criteria (to approved):**
- Boundary compliance verified
- Conformance tests written
- Runtime observability enabled
- Compatibility tests passing

---

### approved
**Entry criteria:**
- Contracts stable (30+ days without breaking changes)
- Conformance tests passing
- Runtime observability confirmed

**Requirements in this state:**
- May be selected by fleet-ops
- Contract tests included in CI
- Compatibility matrix entries exist
- Incident owner assigned

**Exit criteria (to mature):**
- Contract verification stable (90+ days)
- Release policy proven (≥2 releases)
- Observability covering >90% of workflows
- Deprecation plan documented

---

### mature
**Entry criteria:**
- Contract stability demonstrated (90+ days)
- Observability operational
- Release cadence established
- Incident response proven

**Requirements in this state:**
- Full federation support
- SLA/ownership documented
- Backward compatibility policy enforced
- Deprecation plan active

**Exit criteria (to deprecated):**
- Replacement identified
- Migration path published
- Successor tested and approved
- Announcement issued (90-day window)

---

### deprecated
**Entry criteria:**
- Replacement identified and tested
- Migration path published
- Current consumers identified
- Sunset date set (90+ days from announcement)

**Requirements in this state:**
- No new consumers permitted
- Active notifications to existing consumers
- Support provided during transition
- Replacement availability confirmed

**Exit criteria (to quarantined):**
- Migration phase reached (30 days pre-sunset)
- No active new deployments
- Fallback provider configured

---

### quarantined
**Entry criteria:**
- Sunset date reached
- Provider no longer selected for new work
- Consumers migrated or deadline exceeded

**Requirements in this state:**
- Provider disabled in fleet-ops
- Existing leases monitored
- Health checks enabled
- Recovery/retirement plan documented

**Exit criteria (to retired):**
- All existing leases migrated or expired
- Consumer inventory cleared
- Credentials revoked
- Repository archive prepared

---

### retired
**Entry criteria:**
- All consumers migrated
- Leases drained
- Credentials/routes removed
- Final documentation archived

**Requirements in this state:**
- Repository archived (read-only)
- Catalog entry disabled
- Compatibility references removed
- Historical documentation preserved

**No exit criteria:** Retired state is terminal
- Archive preserved indefinitely
- Reference documentation available for historical analysis
- Re-activation requires admission as new repository

