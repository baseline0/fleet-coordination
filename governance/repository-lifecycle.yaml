## Admission & Retirement Gates

### Admission Gate (proposed → incubating)

Before a new repository enters the federation:

- [ ] Role declaration (owner + public contracts)
- [ ] Owner assigned (named person)
- [ ] Dependency declaration (allowed + forbidden)
- [ ] Security assessment complete
- [ ] Provider/capability catalog entry drafted
- [ ] Conformance test skeleton created
- [ ] Release policy documented
- [ ] Architecture review completed

**Approver:** Architecture control plane

---

### Maturity Promotion (approved → mature)

Before a repository moves to production federation status:

- [ ] Contract stability verified (90+ days)
- [ ] Test coverage ≥90% (critical paths)
- [ ] Runtime observability enabled
- [ ] Boundary compliance verified
- [ ] Release policy proven (≥2 releases)
- [ ] Incident response documented
- [ ] Operational ownership on-call
- [ ] Backward compatibility policy enforced

**Approver:** Architecture control plane + operational lead

---

### Deprecation Notice (mature → deprecated)

Before retiring a repository:

- [ ] Replacement identified and tested
- [ ] Migration path published
- [ ] Current consumer inventory created
- [ ] Successor availability confirmed
- [ ] Sunset date set (90+ days out)
- [ ] Announcement issued
- [ ] Support period defined

**Approver:** Repository owner + architecture control plane

---

### Retirement Gate (quarantined → retired)

Before archiving a repository:

- [ ] All consumers migrated
- [ ] Existing leases expired or transferred
- [ ] Credentials revoked
- [ ] Provider disabled in fleet-ops
- [ ] Catalog entry removed
- [ ] Repository archived (read-only)
- [ ] Final documentation preserved

**Approver:** Architecture control plane

---

## Admission Checklist

Each repository must provide before admission:

- [ ] Role declaration (owner + public contracts)
- [ ] Public contracts (versioned, exported)
- [ ] Owner (named person)
- [ ] Dependency declaration (allowed + forbidden)
- [ ] Provider/capability catalog entry
- [ ] Conformance tests (consumer-driven contracts)
- [ ] Security posture assessment
- [ ] Release/version policy

---

## Maturity Promotion Criteria

To promote from proposed/incubating to approved/mature:

- [ ] Contract stability (no breaking changes in 30 days)
- [ ] Test coverage (≥90% for critical paths)
- [ ] Runtime observability (audit events, error logs, health checks)
- [ ] Boundary compliance (all imports documented or remediated)
- [ ] Documented operational ownership (on-call, maintenance)

---

## Deprecation & Extinction Workflow

### Deprecation (e.g., rope-mcp v0.6.0 → v0.7.0)

```yaml
deprecated:
  announcement_date: "2026-09-20"
  sunset_date: "2026-12-31"
  migration_target: "rope-mcp v0.7.2"
  notification_channels: "# NOTE: list communication channels"
```

### Quarantine (provider no longer selected)

```yaml
quarantined:
  reason: "rope-mcp replaced by refactor-library (generic refactoring)"
  start_date: "2027-01-15"
  existing_leases:
    - workspace_id: "proj-a"
      lease_expires: "2027-02-15"
      fallback_provider: "refactor-library v1.0"
```

### Retirement (repository removed)

```yaml
retired:
  retirement_date: "2027-03-15"
  archive_location: "https://github.com/archive/rope-mcp"
  migration_status: "all_leases_migrated"
  final_documentation: "https://docs.example.com/rope-mcp-v0.7-final"
```

