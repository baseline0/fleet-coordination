apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: fleet-coordination
  title: Fleet Coordination
  description: Governance and trial management system for fleet-wide versioned policies,
    trial profiles, and contract definitions
  labels:
    layer: '1'
    type: infrastructure
    language: python
spec:
  type: service
  lifecycle: production
  owner: trial-lead
  dependsOn:
  - fleet-base
  provides:
  - TrialProfile
  - GovernanceSnapshots
  - CapabilityContracts
  tags:
  - governance
  - policy
  - trial-management
  - contracts
  responsibilities:
  - "Author and maintain fleet-wide .fleet/ governance schema"
  - "Define fleet compliance policies and required fields"
  - "Publish policy decisions via ADRs in governance/"
  - "Manage policy versioning and contract definitions"
  - "Own all .fleet/config.yaml and .fleet/catalog-info.yaml changes across fleet"
schema_version: '1.0'
