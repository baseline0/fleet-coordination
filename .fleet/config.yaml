type: infrastructure
language: python
test_framework: pytest
standards:
  type_hints: required
  docstrings: google-style
  max_line_length: 120
governance:
  enabled: true
  fixable-categories:
  - environment
  - config
  - discovery
  protected-paths:
  - trial/
  - governance/
  - contracts/
testing:
  min_coverage: 80
  test_command: pytest tests/
  coverage_report: html
guard-rails:
  max-lines-changed: 500
  require-approval: false
schema_version: '1.0'
